name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_BUILDKIT: 1

jobs:
  # ==================== LINT & FORMAT ====================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff black isort

      - name: Check formatting with Black
        run: black --check --diff src/ tests/

      - name: Check imports with isort
        run: isort --check-only --diff src/ tests/

      - name: Lint with Ruff
        run: ruff check src/ tests/

  # ==================== UNIT TESTS ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ==================== DOCKER BUILD ====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: sentinelx-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: sentinelx-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== INTEGRATION TESTS ====================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx_secret
          POSTGRES_DB: sentinelx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U sentinelx; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration --tb=short || true
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://sentinelx:sentinelx_secret@localhost:5432/sentinelx_db
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2
          OLLAMA_TIMEOUT: 10

  # ==================== SECURITY SCAN ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r src/ -ll -ii -x tests/

      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements.txt --full-report || true
        continue-on-error: true

  # ==================== ML MODEL VALIDATION ====================
  model-validation:
    name: ML Model Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate model artifacts exist
        run: |
          echo "Checking model metadata files..."
          test -f models/feature_names.json && echo "✓ feature_names.json exists"
          test -f models/training_config.json && echo "✓ training_config.json exists"
          test -f models/cv_metrics.json && echo "✓ cv_metrics.json exists"

      - name: Validate feature configuration
        run: |
          python -c "
          import json
          with open('models/feature_names.json') as f:
              features = json.load(f)
          print(f'✓ Model expects {len(features)} features')
          assert len(features) == 124, 'Expected 124 features'
          print('✓ Feature count validation passed')
          "

      - name: Validate CV metrics
        run: |
          python -c "
          import json
          with open('models/cv_metrics.json') as f:
              metrics = json.load(f)
          pr_auc = metrics.get('mean_pr_auc', 0)
          print(f'✓ Mean PR-AUC: {pr_auc:.4f}')
          assert pr_auc > 0.5, 'PR-AUC should be > 0.5'
          print('✓ Model performance validation passed')
          "
